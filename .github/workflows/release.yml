name: Windows-Installer bauen

# Läuft bei jedem Tag der Form v0.1.0 und lässt sich auch von Hand starten.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Installer als Artefakt speichern
        uses: actions/upload-artifact@v4
        with:
          name: shot-analyzer-windows
          path: release/*.exe
      - name: Release veröffentlichen (nur bei Tags)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.exe
          generate_release_notes: true
